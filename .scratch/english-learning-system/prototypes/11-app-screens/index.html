<!doctype html>
<!-- PROTOTYPE — throwaway. 票「App 的屏幕与流程原型」。
     三种导航结构（?variant=A|B|C），共用测试 / 卡片 / 进度 / 设置屏。数据全是假的，只在内存里。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屏幕原型（PROTOTYPE）</title>
<style>
  :root { --bg:#eef0f3; --fg:#1c1c1e; --muted:#8e8e93; --line:#e5e5ea; --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, "PingFang SC", sans-serif; }
  .wrap { display:flex; gap:28px; padding:24px 16px 90px; justify-content:center; flex-wrap:wrap; }
  .phone { width:375px; height:740px; background:#f2f2f7; border:10px solid #111; border-radius:44px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .statusbar { height:34px; flex:none; display:flex; justify-content:space-between; padding:8px 22px 0; font-size:13px; font-weight:600; }
  .screen { flex:1; overflow:auto; display:flex; flex-direction:column; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:6px 16px 10px; min-height:44px; }
  .nav h1 { font-size:28px; margin:0; }
  .nav .t { font-size:17px; font-weight:600; }
  .icon { font-size:20px; cursor:pointer; color:var(--blue); background:none; border:0; padding:4px; }
  .pill { font-size:12px; padding:3px 9px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .pill.ok { background:#e8f8ec; color:#1e8e3e; } .pill.pend { background:#fff3e0; color:#b26a00; } .pill.err { background:#ffe5e3; color:var(--red); } .pill.off { background:#ececf0; color:#555; }
  .errbar { background:var(--red); color:#fff; padding:8px 14px; font-size:13px; cursor:pointer; }
  .offbar { background:#d1d1d6; color:#333; padding:6px 14px; font-size:12px; }
  .sec { background:var(--card); margin:8px 16px; border-radius:12px; padding:14px; }
  .sec h3 { margin:0 0 6px; font-size:13px; color:var(--muted); font-weight:500; }
  .big { font-size:40px; font-weight:700; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:600; background:var(--blue); color:#fff; cursor:pointer; margin-top:10px; }
  .btn.sec2 { background:#e5e5ea; color:var(--fg); }
  .btn:disabled { opacity:.4; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:last-child { border:0; }
  .tabbar { flex:none; display:flex; border-top:1px solid var(--line); background:#f9f9f9; padding:6px 0 18px; }
  .tabbar div { flex:1; text-align:center; font-size:11px; color:var(--muted); cursor:pointer; }
  .tabbar div b { display:block; font-size:22px; font-weight:400; }
  .tabbar div.on { color:var(--blue); }
  .bandbar { display:flex; height:14px; border-radius:7px; overflow:hidden; margin:8px 0 4px; }
  .legend span { margin-right:10px; font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:4px; margin-right:3px; }
  .word { font-size:40px; font-weight:700; text-align:center; margin:70px 0 6px; }
  .yn { display:flex; gap:12px; padding:16px; margin-top:auto; }
  .yn button { flex:1; padding:18px; font-size:18px; border-radius:14px; border:0; cursor:pointer; font-weight:600; }
  .opt { display:block; width:calc(100% - 32px); margin:8px 16px; padding:14px; border-radius:12px; border:1px solid var(--line); background:#fff; text-align:left; font-size:16px; cursor:pointer; }
  .progress { height:4px; background:#e5e5ea; margin:0 16px; border-radius:2px; } .progress i { display:block; height:100%; background:var(--blue); border-radius:2px; }
  .cardface { background:#fff; margin:12px 16px; border-radius:16px; padding:22px; flex:1; display:flex; flex-direction:column; cursor:pointer; }
  .grades { display:flex; gap:8px; padding:12px 16px 20px; }
  .grades button { flex:1; padding:12px 4px; border:0; border-radius:12px; color:#fff; font-weight:600; cursor:pointer; font-size:15px; }
  .grades small { display:block; font-weight:400; font-size:11px; opacity:.85; }
  .step { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .step:last-child { border:0; } .step .n { width:28px; height:28px; border-radius:14px; background:#e5e5ea; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .step.done .n { background:var(--green); color:#fff; } .step.cur .n { background:var(--blue); color:#fff; }
  input[type=text], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  .panel { width:340px; background:#fff; border-radius:14px; padding:16px; align-self:flex-start; }
  .panel h2 { font-size:16px; margin:0 0 8px; }
  .panel label { display:block; margin:8px 0 2px; font-size:13px; color:#555; }
  .panel select, .panel button { font:inherit; padding:6px 8px; margin:2px 4px 2px 0; }
  .panel pre { background:#f6f6f8; padding:8px; border-radius:8px; font-size:12px; white-space:pre-wrap; max-height:220px; overflow:auto; }
  .panel .q { background:#fffbe6; border:1px solid #f0e3a0; padding:8px 10px; border-radius:8px; font-size:13px; margin-top:10px; }
  .switcher { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#111; color:#fff; border-radius:30px; padding:8px 14px; display:flex; gap:14px; align-items:center; box-shadow:0 6px 20px rgba(0,0,0,.3); z-index:9; font-size:14px; }
  .switcher button { background:#333; color:#fff; border:0; border-radius:16px; width:32px; height:32px; cursor:pointer; font-size:16px; }
  .spark { width:100%; height:60px; }
  .freq { display:flex; align-items:center; gap:8px; font-size:12px; margin:3px 0; } .freq .b { flex:1; height:8px; background:#e5e5ea; border-radius:4px; overflow:hidden; } .freq .b i { display:block; height:100%; background:var(--green); }
  @media (max-width:760px){ .panel{ width:100%; max-width:375px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>●●● 􀙇 🔋</span></div>
    <div id="globalbar"></div>
    <div class="screen" id="screen"></div>
    <div id="tabbar"></div>
  </div>
  <div class="panel">
    <h2>原型控制台（不是 App 的一部分）</h2>
    <div class="muted" id="varname"></div>
    <label>令牌状态（模拟）</label>
    <select id="tok">
      <option value="ok">正常</option>
      <option value="expired">已过期 / 被撤销（401）</option>
      <option value="missing">未设置</option>
      <option value="offline">网络断开（不是错误）</option>
    </select>
    <label>卡片评分按钮</label>
    <select id="grade">
      <option value="4">4 档（忘了 / 模糊 / 想起 / 太简单）— FSRS 原生</option>
      <option value="2">2 档（不认识 / 认识）— 百词斩式</option>
    </select>
    <label>模拟事件</label>
    <button id="fg">App 回到前台（触发同步）</button>
    <button id="reset">重新首次启动</button>
    <label>当前状态</label>
    <pre id="state"></pre>
    <div class="q"><b>请你看的三件事：</b><br>1. 三种首页结构（底部切换 ← →）哪种顺手？<br>2. 卡片评分要 4 档还是 2 档？<br>3. 「未同步 N 条」和令牌报错放的位置是否够显眼又不烦？</div>
  </div>
</div>
<div class="switcher"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

<script>
const VARIANTS = { A:'底部标签栏（像墨墨）', B:'今日一条龙（像百词斩）', C:'看板首页' };
const KEYS = Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get('variant') || 'A';
if (!VARIANTS[variant]) variant = 'A';

const TEST_ITEMS = [
  {w:'reluctant', real:true, zh:'不情愿的'}, {w:'flimber', real:false}, {w:'allocate', real:true, zh:'分配'},
  {w:'scrutiny', real:true, zh:'仔细审查'}, {w:'cradant', real:false}, {w:'plausible', real:true, zh:'貌似可信的'},
  {w:'meticulous', real:true, zh:'一丝不苟的'}, {w:'sproke', real:false},
];
const CHECKS = [
  {w:'allocate', opts:['分配','宣称','减轻','模仿','不认识'], a:0},
  {w:'plausible', opts:['可塑的','貌似可信的','值得称赞的','多余的','不认识'], a:1},
];
const CARDS = [
  {w:'inevitable', ipa:'/ɪnˈevɪtəbl/', pos:'adj.', en:'certain to happen and impossible to avoid', ex:'Some job losses now seem <b>inevitable</b>.', zh:'不可避免的；必然发生的'},
  {w:'subtle', ipa:'/ˈsʌtl/', pos:'adj.', en:'not very noticeable or obvious', ex:'There are <b>subtle</b> differences between the two versions.', zh:'细微的；微妙的'},
  {w:'reluctant', ipa:'/rɪˈlʌktənt/', pos:'adj.', en:'not willing to do something', ex:'She was <b>reluctant</b> to admit her mistake.', zh:'不情愿的；勉强的'},
  {w:'scrutiny', ipa:'/ˈskruːtəni/', pos:'n.', en:'careful and thorough examination', ex:'The plan came under close <b>scrutiny</b>.', zh:'仔细审查'},
];

const S = {
  firstRun:true, hasToken:false, tok:'ok', gradeMode:'4',
  screen:'home', tab:'study', unsynced:0, lastSync:null, syncErr:null,
  baselineDone:false, testDoneToday:false, reviewsDone:0, dueCards:4,
  vocab:4180, ci:320, delta:0, bands:{M:3650, T:1840, D:19510}, streak:6,
  t:{i:0, phase:'yn', kind:'short', answers:[]}, c:{i:0, flipped:false},
};

function now(){ return new Date().toTimeString().slice(0,5); }
function addObs(n=1){ S.unsynced += n; }
function trySync(reason){
  if (S.unsynced===0 && S.tok==='ok' && S.hasToken) { S.syncErr=null; return; }
  if (S.tok==='offline') { S.syncErr=null; return; }
  if (!S.hasToken || S.tok==='missing') { S.syncErr='还没设置 GitHub 令牌，记录只存在本机。'; return; }
  if (S.tok==='expired') { S.syncErr='GitHub 令牌已过期或被撤销（401）。记录都还在本机，换好令牌后会自动补交。'; return; }
  S.unsynced=0; S.lastSync=now(); S.syncErr=null;
}
function go(screen, extra){ S.screen=screen; Object.assign(S, extra||{}); render(); }

/* ---------- 同步状态的三种摆法 ---------- */
function syncPill(){
  if (S.syncErr) return `<span class="pill err" onclick="go('settings')">⚠︎ 同步失败 · 未同步 ${S.unsynced} 条</span>`;
  if (S.tok==='offline' && S.unsynced) return `<span class="pill off">离线 · 未同步 ${S.unsynced} 条</span>`;
  if (S.unsynced) return `<span class="pill pend" onclick="syncNow()">未同步 ${S.unsynced} 条</span>`;
  return `<span class="pill ok" onclick="go('settings')">✓ 已同步${S.lastSync?' '+S.lastSync:''}</span>`;
}
function globalBar(){
  if (S.firstRun) return '';
  if (S.syncErr) return `<div class="errbar" onclick="go('settings')">⚠︎ ${S.syncErr} 点此去设置 ›</div>`;
  if (S.tok==='offline' && S.unsynced) return `<div class="offbar">离线中，联网后自动同步</div>`;
  return '';
}
function syncNow(){ trySync('manual'); render(); }

/* ---------- 共用屏 ---------- */
function onboarding(){
  const step = S.obStep||0;
  if (step===0) return `<div class="nav"><h1>你好</h1></div>
    <div class="sec">这个 App 会先测出你的词汇量，再只给你「正好该学」的词发卡片。<br><br>所有记录都存到你自己的私有 GitHub 仓库 <code>english-data</code>。</div>
    <div style="padding:0 16px;margin-top:auto;padding-bottom:20px"><button class="btn" onclick="S.obStep=1;render()">开始设置</button></div>`;
  if (step===1) return `<div class="nav"><span class="t">第 1 步：连接 GitHub</span></div>
    <div class="sec"><h3>粘贴令牌（fine-grained PAT）</h3>
      <textarea rows="3" placeholder="github_pat_…" id="patin"></textarea>
      <div class="muted" style="margin-top:6px">只需授权 english-data 仓库的 Contents 读写。令牌存在钥匙串里。<br><a href="#" onclick="return false">怎么创建令牌？</a></div>
      <button class="btn" onclick="S.hasToken=true;S.obStep=2;render()">验证并保存</button>
      <button class="btn sec2" onclick="S.obStep=2;render()">先跳过，稍后再设</button></div>`;
  return `<div class="nav"><span class="t">第 2 步：基线测试</span></div>
    <div class="sec"><div class="big">约 30 分钟</div>
      <div class="muted">一次性的完整测试，用来定出你的起点。中途可以退出，下次从断点继续。之后每天只需 3–5 分钟的短测。</div>
      <button class="btn" onclick="startTest('baseline')">开始基线测试</button></div>`;
}
function startTest(kind){ S.firstRun=false; S.t={i:0, phase:'yn', kind, answers:[]}; go('test'); }
function testScreen(){
  const t=S.t, base = t.kind==='baseline';
  const total = TEST_ITEMS.length + CHECKS.length;
  const done = t.phase==='yn' ? t.i : TEST_ITEMS.length + t.i;
  const head = `<div class="nav"><button class="icon" onclick="exitTest()">✕</button><span class="t">${base?'基线测试':'今日短测'}</span><span class="muted">${base?'剩约 27 分':'剩约 3 分'}</span></div>
    <div class="progress"><i style="width:${done/total*100}%"></i></div>`;
  if (t.phase==='yn'){
    const it = TEST_ITEMS[t.i];
    return head + `<div class="muted" style="text-align:center;margin-top:16px">你认识这个词吗？（有些是编出来的假词）</div>
      <div class="word">${it.w}</div>
      <div class="muted" style="text-align:center">演示只出 ${TEST_ITEMS.length} 题，实际约 ${base?'几百':'80'} 题</div>
      <div class="yn"><button style="background:#e5e5ea" onclick="ans(false)">不认识</button><button style="background:var(--blue);color:#fff" onclick="ans(true)">认识</button></div>`;
  }
  if (t.phase==='check'){
    const c = CHECKS[t.i];
    return head + `<div class="muted" style="text-align:center;margin-top:16px">核验：选出意思</div>
      <div class="word" style="margin-top:30px">${c.w}</div>
      <div style="margin-top:auto;padding-bottom:16px">${c.opts.map((o,k)=>`<button class="opt" onclick="chk(${k})">${o}</button>`).join('')}</div>`;
  }
  return `<div class="nav"><span class="t">${base?'基线测试完成':'今日短测完成'}</span></div>
    <div class="sec" style="text-align:center"><h3>估计词汇量</h3><div class="big">${S.vocab.toLocaleString()}</div>
      <div class="muted">可能范围 ${(S.vocab-S.ci).toLocaleString()} – ${(S.vocab+S.ci).toLocaleString()}${base?'':` · 较上次 ${S.delta>=0?'+':''}${S.delta}`}</div></div>
    <div class="sec"><div class="row"><span>新发现的 Target 词</span><b>7</b></div>
      <div class="row"><span>抽查的已掌握词</span><span>6 对 / 1 错（退回 Target）</span></div>
      <div class="row"><span>假词误认</span><span>1 / 3</span></div></div>
    <div class="sec muted">${base?'':'今天第一次短测，云端会据此更新公开的 Progress Report。'}本机已记下 ${S.unsynced} 条，结束后自动同步。</div>
    <div style="padding:0 16px 20px;margin-top:auto"><button class="btn" onclick="finishTest()">${variant==='B'?'继续：复习卡片':'完成'}</button></div>`;
}
function ans(yes){ addObs(); S.t.answers.push(yes); S.t.i++; if (S.t.i>=TEST_ITEMS.length){ S.t.phase='check'; S.t.i=0; } render(); }
function chk(k){ addObs(); S.t.i++; if (S.t.i>=CHECKS.length) S.t.phase='result'; render(); }
function exitTest(){ if (S.t.kind==='baseline' && !confirm('退出后下次从这里继续，已答的题都会保留。退出？')) return; trySync(); go('home'); }
function finishTest(){
  if (S.t.kind==='baseline') S.baselineDone=true; else { S.testDoneToday=true; S.delta=+60; S.vocab+=60; }
  trySync('session-end');
  if (variant==='B') { S.c={i:0,flipped:false}; go('card'); } else go('home');
}
function cardScreen(){
  if (S.c.i>=CARDS.length || S.dueCards===0) return `<div class="nav"><span class="t">今天的卡片完成了</span></div>
    <div class="sec" style="text-align:center"><div class="big">🎉</div>复习 ${S.reviewsDone} 张 · 连续 ${S.streak+1} 天</div>
    <div class="sec muted">新卡只从 Target 词里挑（怎么挑由「Target 词的选取与排序」决定）。</div>
    <div style="padding:0 16px 20px;margin-top:auto"><button class="btn" onclick="trySync();go('home')">回到首页</button></div>`;
  const c = CARDS[S.c.i];
  const head = `<div class="nav"><button class="icon" onclick="trySync();go('home')">✕</button><span class="t">复习 ${S.c.i+1}/${CARDS.length}</span>${syncPill()}</div>`;
  const front = `<div style="text-align:center;margin-top:60px"><div class="big">${c.w}</div><div class="muted">${c.ipa} 🔊</div></div>`;
  if (!S.c.flipped) return head + `<div class="cardface" onclick="S.c.flipped=true;render()">${front}<div class="muted" style="margin-top:auto;text-align:center">先回想意思，再点一下翻面</div></div>`;
  const grades = S.gradeMode==='4'
    ? [['忘了','<1 分','#ff3b30',1],['模糊','6 分','#ff9500',2],['想起','2 天','#34c759',3],['太简单','5 天','#007aff',4]]
    : [['不认识','明天再见','#ff3b30',1],['认识','2 天','#34c759',3]];
  return head + `<div class="cardface">${front}
      <div style="margin-top:22px"><i class="muted">${c.pos}</i> ${c.en}</div>
      <div style="margin-top:10px">${c.ex}</div>
      <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">${c.zh}</div></div>
    <div class="grades">${grades.map(g=>`<button style="background:${g[2]}" onclick="grade(${g[3]})">${g[0]}<small>${g[1]}</small></button>`).join('')}</div>`;
}
function grade(){ addObs(); S.reviewsDone++; S.c.i++; S.c.flipped=false; if (S.c.i>=CARDS.length) S.dueCards=0; render(); }
function startCards(){ S.c={i:0,flipped:false}; go('card'); }

function spark(){
  const pts=[3900,3950,3980,4040,4020,4100,4180].map((v,i)=>`${i*50},${60-(v-3850)/6}`).join(' ');
  return `<svg class="spark" viewBox="0 0 300 60"><polyline points="${pts}" fill="none" stroke="#007aff" stroke-width="2"/></svg>`;
}
function bandBlock(){
  const {M,T,D}=S.bands, tot=M+T+D;
  return `<div class="bandbar"><i style="width:${M/tot*100}%;background:var(--green)"></i><i style="width:${T/tot*100}%;background:var(--orange)"></i><i style="width:${D/tot*100}%;background:#c7c7cc"></i></div>
    <div class="legend"><span><i class="dot" style="background:var(--green)"></i>已掌握 ${M}</span><span><i class="dot" style="background:var(--orange)"></i>正好该学 ${T}</span><span><i class="dot" style="background:#c7c7cc"></i>太遥远 ${D}</span></div>`;
}
function progressBody(){
  return `<div class="sec"><h3>估计词汇量（word family）</h3><div class="big">${S.vocab.toLocaleString()}</div>
      <div class="muted">±${S.ci} · 最近 7 次测试</div>${spark()}</div>
    <div class="sec"><h3>三类词（按 lemma）</h3>${bandBlock()}</div>
    <div class="sec"><h3>各词频段掌握率</h3>
      ${[['1k',98],['2k',91],['3k',74],['4k',52],['5k',31],['6k',18],['8k',8]].map(([k,v])=>`<div class="freq"><span style="width:28px">${k}</span><div class="b"><i style="width:${v}%"></i></div><span style="width:32px">${v}%</span></div>`).join('')}</div>
    <div class="sec"><div class="row"><span>连续学习</span><span>${S.streak} 天</span></div>
      <div class="row"><span>最近测试</span><span>${S.testDoneToday?'今天':'昨天'}</span></div>
      <div class="row"><span>公开看板 english-profile ›</span><span class="muted">外链</span></div>
      <div class="row"><span>最新 Progress Report ›</span><span class="muted">外链</span></div></div>
    <div class="muted" style="padding:0 20px 16px">数字由本机重算；公开看板由云端稍后更新，可能落后几分钟。</div>`;
}
function settingsScreen(){
  const st = S.syncErr ? `<span style="color:var(--red)">失败：${S.tok==='expired'?'令牌过期（401）':'未设置令牌'}</span>` : (S.tok==='offline'?'离线':'正常');
  return `<div class="nav"><button class="icon" onclick="go('home')">‹ 返回</button><span class="t">设置与同步</span><span></span></div>
    <div class="sec"><h3>同步</h3>
      <div class="row"><span>状态</span>${st}</div>
      <div class="row"><span>未同步</span><span>${S.unsynced} 条</span></div>
      <div class="row"><span>上次成功</span><span>${S.lastSync||'从未'}</span></div>
      <div class="row"><span>仓库</span><span class="muted">you/english-data</span></div>
      <button class="btn" onclick="syncNow()">立即同步</button></div>
    <div class="sec"><h3>GitHub 令牌</h3>
      <div class="muted">${S.hasToken?'已保存在钥匙串 · 有效期至 2027-11-12':'未设置'}</div>
      <textarea rows="2" placeholder="粘贴新的 github_pat_…"></textarea>
      <button class="btn sec2" onclick="S.hasToken=true;S.tok='ok';document.getElementById('tok').value='ok';trySync();render()">验证并替换</button></div>
    <div class="sec"><h3>测试</h3><div class="row"><span>重做基线测试</span><span>›</span></div></div>`;
}

/* ---------- 三种首页 ---------- */
function homeA(){
  if (S.tab==='progress') return `<div class="nav"><h1>进度</h1>${syncPill()}</div>` + progressBody();
  if (S.tab==='test') return `<div class="nav"><h1>测试</h1>${syncPill()}</div>
    <div class="sec"><h3>今日短测</h3><div>${S.testDoneToday?'✓ 今天已测':'3–5 分钟 · 约 80 题'}</div>
      <button class="btn ${S.testDoneToday?'sec2':''}" onclick="startTest('short')">${S.testDoneToday?'再测一次':'开始短测'}</button></div>
    <div class="sec"><h3>上次结果</h3><div class="big">${S.vocab.toLocaleString()}</div><div class="muted">±${S.ci}</div></div>`;
  if (S.tab==='settings') return settingsScreen().replace(`<button class="icon" onclick="go('home')">‹ 返回</button>`,'<span></span>');
  return `<div class="nav"><h1>学习</h1>${syncPill()}</div>
    <div class="sec"><h3>今天要复习</h3><div class="big">${S.dueCards}</div><div class="muted">张卡片 · 新卡 0 张（新卡来源见 Target 选词）</div>
      <button class="btn" ${S.dueCards?'':'disabled'} onclick="startCards()">开始复习</button></div>
    ${S.testDoneToday?'':`<div class="sec" onclick="S.tab='test';render()" style="cursor:pointer">📝 今天还没做短测 ›</div>`}`;
}
function tabbarA(){
  if (variant!=='A' || S.screen!=='home' || S.firstRun) return '';
  const t=[['study','📚','学习'],['test','📝','测试'],['progress','📈','进度'],['settings','⚙︎','设置']];
  return `<div class="tabbar">${t.map(([k,i,l])=>`<div class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()"><b>${i}</b>${l}</div>`).join('')}</div>`;
}
function homeB(){
  const s1 = S.testDoneToday ? 'done' : 'cur';
  const s2 = !S.testDoneToday ? '' : (S.dueCards? 'cur':'done');
  const allDone = S.testDoneToday && !S.dueCards;
  return `<div class="nav"><button class="icon" onclick="go('progress')">📈</button><span class="t">今天</span><button class="icon" onclick="go('settings')">⚙︎</button></div>
    <div class="sec" style="text-align:center"><div class="muted">词汇量</div><div class="big">${S.vocab.toLocaleString()}</div><div class="muted">连续 ${S.streak} 天</div></div>
    <div class="sec">
      <div class="step ${s1}"><span class="n">${s1==='done'?'✓':1}</span><div><b>短测</b><div class="muted">3–5 分钟，更新词汇量</div></div></div>
      <div class="step ${s2}"><span class="n">${s2==='done'?'✓':2}</span><div><b>复习卡片</b><div class="muted">${S.dueCards} 张到期</div></div></div>
      <div class="step"><span class="n">3</span><div><b>新词</b><div class="muted">从 Target 词里挑（另一张票决定）</div></div></div>
    </div>
    <div style="padding:0 16px">${allDone?'<button class="btn sec2" disabled>今天完成了</button>':`<button class="btn" onclick="${S.testDoneToday?'startCards()':"startTest('short')"}">${S.testDoneToday?'继续':'开始今天的学习'}</button>`}</div>
    <div style="margin-top:auto;padding:14px;text-align:center">${syncPill()}</div>`;
}
function homeC(){
  const banner = S.unsynced && !S.syncErr ? `<div class="sec" style="background:#fff3e0;display:flex;justify-content:space-between;align-items:center"><span>本机有 <b>${S.unsynced}</b> 条未同步</span><button class="icon" onclick="syncNow()">立即同步</button></div>` : '';
  return `<div class="nav"><h1>我的词汇</h1><button class="icon" onclick="go('settings')">⚙︎</button></div>
    ${banner}
    <div class="sec"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="big">${S.vocab.toLocaleString()}</div><span class="muted">±${S.ci}</span></div>${spark()}${bandBlock()}</div>
    <div class="sec">
      <div class="row" onclick="startCards()"><span>📚 复习卡片</span><b>${S.dueCards} 张 ›</b></div>
      <div class="row" onclick="startTest('short')"><span>📝 今日短测</span><b>${S.testDoneToday?'✓ 已测':'未做 ›'}</b></div>
      <div class="row" onclick="go('progress')"><span>📈 详细进度</span><span>›</span></div>
    </div>
    <div class="muted" style="text-align:center;padding:8px">${S.unsynced||S.syncErr?'':syncPill()}</div>`;
}

/* ---------- 渲染 ---------- */
function render(){
  const el = document.getElementById('screen');
  let html;
  if (S.firstRun) html = onboarding();
  else if (S.screen==='test') html = testScreen();
  else if (S.screen==='card') html = cardScreen();
  else if (S.screen==='settings') html = settingsScreen();
  else if (S.screen==='progress') html = `<div class="nav"><button class="icon" onclick="go('home')">‹ 返回</button><span class="t">进度</span>${syncPill()}</div>` + progressBody();
  else html = variant==='A'?homeA():variant==='B'?homeB():homeC();
  el.innerHTML = html;
  document.getElementById('globalbar').innerHTML = globalBar();
  document.getElementById('tabbar').innerHTML = tabbarA();
  document.getElementById('vlabel').textContent = `${variant}（${VARIANTS[variant]}）`;
  document.getElementById('varname').textContent = `变体 ${variant}：${VARIANTS[variant]}`;
  const {t,c,...rest} = S;
  document.getElementById('state').textContent = JSON.stringify({...rest, test:t.kind+' '+t.phase+' #'+t.i, card:c.i}, null, 1);
}
function setVariant(v){ variant=v; const u=new URL(location); u.searchParams.set('variant',v); history.replaceState(null,'',u); if(!S.firstRun) S.screen='home'; render(); }
function cycle(d){ setVariant(KEYS[(KEYS.indexOf(variant)+d+KEYS.length)%KEYS.length]); }
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return; if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1); });
document.getElementById('tok').onchange=e=>{ S.tok=e.target.value; if(S.tok==='ok'){S.syncErr=null;} render(); };
document.getElementById('grade').onchange=e=>{ S.gradeMode=e.target.value; render(); };
document.getElementById('fg').onclick=()=>{ trySync('foreground'); render(); };
document.getElementById('reset').onclick=()=>location.reload();
render();
</script>
</body>
</html>
