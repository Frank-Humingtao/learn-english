name: EnglishCore

on:
  push:
    paths: ["EnglishCore/**", "tools/lexicon-build/**", ".github/workflows/englishcore.yml"]
  pull_request:
    paths: ["EnglishCore/**", "tools/lexicon-build/**", ".github/workflows/englishcore.yml"]

jobs:
  # The CLI golden-file test (CLITests.profileOutputMatchesGoldenFiles) compares against
  # files generated on macOS, so a green Linux run proves identical summary.json / words.tsv.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path EnglishCore
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path EnglishCore
  lexicon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/lexicon-build/test_build_lexicon.py
